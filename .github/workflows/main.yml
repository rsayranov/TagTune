name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Подпись живёт В РЕПОЗИТОРИИ: первый запуск создаёт keystore и коммитит его,
      # все последующие — берут тот же файл. Кэш больше не участвует.
      - name: Restore or create signing keystore
        run: |
          mkdir -p ~/.android ci
          if [ -f ci/keystore.b64 ]; then
            base64 -d ci/keystore.b64 > ~/.android/debug.keystore
            echo "Keystore restored from repo"
          else
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            base64 -w0 ~/.android/debug.keystore > ci/keystore.b64
            git config user.email "actions@github.com"
            git config user.name "GitHub Actions"
            git add ci/keystore.b64
            git commit -m "ci: store debug keystore [skip ci]"
            git push || true
            echo "Keystore generated and committed"
          fi

      - name: Build APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
